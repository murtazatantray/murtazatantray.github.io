name: Deploy site

# Publishes the static site to the `gh-pages` branch, which GitHub Pages serves.
# No build step is required — the site is plain HTML/CSS/JS.

on:
  push:
    branches:
      - main
      - master
    paths:
      - "index.html"
      - "assets/**"
      - "robots.txt"
      - "sitemap.xml"
      - ".nojekyll"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Assemble static site 📦
        run: |
          mkdir -p _site
          cp index.html _site/
          cp robots.txt _site/
          cp sitemap.xml _site/
          cp .nojekyll _site/
          cp -r assets _site/assets

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          clean: true
